<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('Enviar Mensaje — Veterinaria Patitas')}"></th:block>
</head>
<body>

<header>
    <div th:replace="fragments/navbar :: navbar"></div>
</header>

<div class="split-hero">
    <div class="container">
        <div class="row w-100 align-items-center g-4">
            <div class="col-md-6 text-center order-2 order-md-1">
                <h1>ESTAMOS AL CUIDADO DE TU MASCOTA</h1>
                <p class="lead">Envíanos tus dudas y estaremos encantados de ayudarte.</p>
                <button class="btn btn-teal" data-bs-toggle="modal" data-bs-target="#contactoModal">
                    <i class="fa-solid fa-envelope me-2"></i>CONTÁCTANOS
                </button>
            </div>
            <div class="col-md-6 text-center order-1 order-md-2">
                <img th:src="@{/img/DESCARGA2.jpg}" alt="Mascota" class="img-fluid">
            </div>
        </div>
    </div>
</div>

<!-- Modal de contacto -->
<div class="modal fade" id="contactoModal" tabindex="-1" aria-labelledby="contactoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="contactoModalLabel">
                    <i class="fa-solid fa-paper-plane me-2 text-patitas"></i>Envíanos un Mensaje
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <form id="contactoForm" th:action="@{/upload}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre Completo:</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico:</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="telefono" class="form-label">Número de Teléfono (opcional):</label>
                        <input type="tel" class="form-control" id="telefono" name="telefono"
                               maxlength="9"
                               pattern="[0-9]{9}"
                               title="El número de teléfono debe tener exactamente 9 dígitos."
                               placeholder="Ej: 987654321">
                    </div>
                    <div class="mb-3">
                        <label for="tipo_mensaje" class="form-label">Tipo de Mensaje:</label>
                        <select class="form-select" id="tipo_mensaje" name="tipo_mensaje" required>
                            <option value="">Selecciona una opción</option>
                            <option value="queja">Queja</option>
                            <option value="cita">Solicitud de Cita</option>
                            <option value="consulta">Consulta</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="nombre_mascota" class="form-label">Nombre de la Mascota:</label>
                        <input type="text" class="form-control" id="nombre_mascota" name="nombre_mascota">
                    </div>
                    <div class="mb-3">
                        <label for="motivo_cita" class="form-label">Motivo de la Cita:</label>
                        <input type="text" class="form-control" id="motivo_cita" name="motivo_cita">
                    </div>
                    <div class="mb-3">
                        <label for="mensaje" class="form-label">Mensaje:</label>
                        <textarea class="form-control" id="mensaje" name="mensaje" rows="4" required></textarea>
                        <small id="wordCount" class="form-text text-muted">0 / 200 palabras.</small>
                    </div>
                    <div class="mb-3">
                        <label for="pdfFile" class="form-label">Subir PDF (opcional):</label>
                        <input type="file" class="form-control" id="pdfFile" name="pdfFile" accept=".pdf">
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-teal">Enviar Mensaje</button>
                        <button type="reset" class="btn btn-outline-teal">Limpiar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>

<th:block th:replace="~{fragments/modales_login :: modales_login}"></th:block>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('contactoForm');
        const telefonoInput = document.getElementById('telefono');
        const mensajeTextarea = document.getElementById('mensaje');
        const wordCountSpan = document.getElementById('wordCount');
        const maxWords = 200;

        // --- Lógica de Teléfono (Restricción de Dígitos en Tiempo Real) ---
        if (telefonoInput) {
            telefonoInput.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                if (this.value.length > 9) {
                    this.value = this.value.slice(0, 9);
                }
            });
        }

        // --- Lógica de Mensaje (Contador de palabras en Tiempo Real) ---
        if (mensajeTextarea && wordCountSpan) {
            mensajeTextarea.addEventListener('input', function() {
                const text = this.value.trim();
                const words = text ? text.split(/\s+/).filter(word => word.length > 0) : [];
                let currentWordCount = words.length;

                wordCountSpan.textContent = `${currentWordCount} / ${maxWords} palabras.`;

                if (currentWordCount > maxWords) {
                    const validText = words.slice(0, maxWords).join(' ');
                    this.value = validText;
                    currentWordCount = maxWords;
                    wordCountSpan.textContent = `${currentWordCount} / ${maxWords} palabras.`;
                    wordCountSpan.style.color = 'red';
                } else {
                    wordCountSpan.style.color = 'inherit';
                }
            });
        }

        // --- Lógica de Bloqueo de Envío (Doble chequeo del Frontend) ---
        if (form) {
            form.addEventListener('submit', function(e) {
                let isValid = true;

                const text = mensajeTextarea.value.trim();
                const words = text ? text.split(/\s+/).filter(word => word.length > 0) : [];
                const currentWordCount = words.length;

                if (currentWordCount > maxWords) {
                    isValid = false;
                    alert(`Error de validación: El mensaje excede el límite de ${maxWords} palabras.`);
                    mensajeTextarea.focus();
                }

                const telefonoValue = telefonoInput.value.trim();
                if (telefonoValue.length > 0 && telefonoValue.length !== 9) {
                    isValid = false;
                    alert('Error de validación: El número de teléfono debe tener 9 dígitos.');
                    telefonoInput.focus();
                }

                if (!isValid) {
                    e.preventDefault();
                }
            });
        }
    });
</script>

</body>
</html>
