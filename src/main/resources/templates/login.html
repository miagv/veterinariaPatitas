<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('Iniciar Sesión — Veterinaria Patitas')}"></th:block>
</head>

<body class="login-page">

    <div class="login-card">
        <img th:src="@{/img/portadafondo.png}" alt="Veterinaria Patitas" class="login-logo">
        <h2>Iniciar Sesión</h2>
        <p class="sub">Accede a tu cuenta de Veterinaria PATITAS</p>

        <form th:action="@{/login}" method="post" class="text-start">
            <div class="mb-3">
                <label class="form-label" for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" class="form-control" required>
            </div>

            <div class="mb-4">
                <label class="form-label" for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" class="form-control" required>
            </div>

            <div th:if="${error}" class="alert alert-danger py-2" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${error}"></span>
            </div>

            <button type="submit" class="btn btn-teal w-100 py-2">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Ingresar
            </button>
        </form>

        <p class="mt-4 mb-0">
            <a th:href="@{/}" class="fw-bold">
                <i class="fa-solid fa-arrow-left me-1"></i>Volver al inicio
            </a>
        </p>
    </div>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
